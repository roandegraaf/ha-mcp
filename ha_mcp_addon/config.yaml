name: "Home Assistant MCP Server"
description: "MCP server for setting up and maintaining Home Assistant with AI assistants"
version: "0.2.2"
slug: ha_mcp
image: "ghcr.io/roandegraaf/ha-mcp-{arch}"
url: "https://github.com/roandegraaf/ha-mcp"
arch:
  - amd64
  - aarch64
homeassistant_api: true
map:
  - "homeassistant_config:ro"
init: false
ingress: true
ingress_port: 8100
panel_icon: "mdi:connection"
panel_admin: true
panel_title: "MCP Server"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "MCP HTTP port"
options:
  confirm_mode: "client"
  read_only: false
  enable_device_control: false
  enable_config_files: false
  allow_secrets_file: false
  log_level: "INFO"
schema:
  api_key: "password?"
  confirm_mode: "list(client|elicit)"
  read_only: "bool"
  enable_device_control: "bool"
  enable_config_files: "bool"
  allow_secrets_file: "bool"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
