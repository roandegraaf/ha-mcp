name: "Home Assistant MCP Server"
description: "MCP server for AI-powered Home Assistant management and control"
version: "0.1.12"
slug: ha_mcp
# image: "ghcr.io/roandegraaf/ha-mcp-{arch}"
url: "https://github.com/roandegraaf/ha-mcp"
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - homeassistant_config:ro
init: false
ingress: true
ingress_port: 8100
panel_icon: "mdi:connection"
panel_title: "MCP Server"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "MCP HTTP port"
options:
  transport: "http"
  log_level: "INFO"
  enable_config_files: false
  enable_ha_cli: false
schema:
  transport: "list(http)"
  log_level: "list(DEBUG|INFO|WARNING|ERROR)"
  enable_config_files: "bool"
  enable_ha_cli: "bool"
